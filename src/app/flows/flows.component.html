<div class="page-header flows-header">
  <a routerLink="/environments" class="back-link">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m15 18-6-6 6-6"/>
    </svg>
  </a>
  <div>
    <h1 class="page-title">Flows</h1>
    <p class="page-subtitle">Environment: {{ envId }}</p>
  </div>
</div>

<div *ngIf="isLoading" class="spinner"></div>

<div *ngIf="error" class="card error-card">
  {{ error }}
</div>

<div class="grid" *ngIf="!isLoading && !error">
  <div *ngIf="flows.length === 0" class="empty-state">
    No flows found in this environment.
  </div>

  <a *ngFor="let flow of flows" [routerLink]="['/flow-definition', envId, flow.flowId]" class="card">
    <h3 class="flow-card-title">
      {{ flow.flowName || 'Unnamed Flow' }}
      <span class="badge" [class.started]="flow.state === 'Started'" [class.stopped]="flow.state !== 'Started'">
        {{ flow.state }}
      </span>
    </h3>
    <p class="flow-id-text">
      ID: {{ flow.flowId }}
    </p>
  </a>
</div>
