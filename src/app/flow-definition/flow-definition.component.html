<div class="page-header definition-header">
  <a [routerLink]="['/flows', envId]" class="back-link">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m15 18-6-6 6-6"/>
    </svg>
  </a>
  <div>
    <h1 class="page-title">Flow Definition</h1>
    <p class="page-subtitle">ID: {{ flowId }}</p>
  </div>
</div>

<!-- Search inside JSON with travel controls -->
<div *ngIf="!isLoading && !error" class="search-container">
  <div class="search-wrapper">
    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input 
      type="text" 
      [(ngModel)]="searchQuery" 
      (ngModelChange)="onSearchChange()"
      placeholder="Search text in flow definition JSON..." 
      class="search-input"
    />
    <div *ngIf="searchQuery.trim()" class="search-controls">
      <span class="match-badge">
        {{ matchCount > 0 ? (currentMatchIndex + 1) : 0 }} / {{ matchCount }}
      </span>
      <button class="nav-btn" (click)="prevMatch()" [disabled]="matchCount === 0" title="Previous match">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </button>
      <button class="nav-btn" (click)="nextMatch()" [disabled]="matchCount === 0" title="Next match">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 18 6-6-6-6"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<div *ngIf="isLoading" class="spinner"></div>

<div *ngIf="error" class="card error-card">
  {{ error }}
</div>

<div class="card definition-card" *ngIf="!isLoading && !error">
  <pre class="definition-pre" contenteditable="true" (keydown)="onKeyDown($event)"><code [innerHTML]="highlightedJson"></code></pre>
</div>
